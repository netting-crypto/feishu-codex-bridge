services:
  - type: web
    name: feishu-mcp
    runtime: docker
    plan: free
    region: singapore
    rootDir: render-mcp
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: APP_ID
        value: cli_aae195540df8dd24
      - key: APP_SECRET
        sync: false
      - key: LARK_DOMAIN
        value: https://open.feishu.cn
      - key: MCP_PUBLIC_URL
        value: https://feishu-mcp-qr4u.onrender.com
      - key: MCP_OAUTH_CLIENT_ID
        value: feishu-gtd-chatgpt
      - key: MCP_OAUTH_CLIENT_SECRET
        generateValue: true
      - key: MCP_OWNER_PASSWORD
        generateValue: true
      - key: MCP_OAUTH_SIGNING_KEY
        generateValue: true
      - key: MCP_OAUTH_REDIRECT_URIS
        value: https://chatgpt.com/connector_platform_oauth_redirect
